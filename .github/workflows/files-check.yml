name: Files check

# Automatic and light: nothing is computed, Git LFS files are not downloaded.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Names, .gitattributes, LFS pointers, PDFs and README links
        run: uv run --no-project --with pypdf python .github/scripts/check_files.py
